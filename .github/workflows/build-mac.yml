name: Build macOS

# macOS 安装包只能在 macOS 上构建；手动触发或推送 mac-* 标签时在 GitHub 的 macOS 机器上打包，
# 产物（dmg / zip，Apple 芯片与 Intel 各一份）作为 workflow artifact 上传，打标签时同时挂到 Release。
on:
  workflow_dispatch:
  push:
    tags:
      - 'mac-*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          node node_modules/electron/install.js
      - name: Prepare client data
        run: npm run prepare:client-data
      - name: Build renderer and main
        run: npm run build
      - name: Package for macOS
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --publish never
      - name: List artifacts
        run: ls -la build | grep -Ei 'dmg|zip' || true
      - uses: actions/upload-artifact@v4
        with:
          name: aramgg_client-mac
          path: |
            build/*.dmg
            build/*.zip
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/mac-')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.dmg
            build/*.zip
