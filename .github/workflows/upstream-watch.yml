name: Watch upstream releases

# 每天检查一次作者仓库 valkia/aramgg_client 的最新 release；
# 发现本 fork 还没记录过的新版本时，创建一个 issue 并指派给仓库所有者（GitHub 会发邮件通知）。
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check latest upstream release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: valkia/aramgg_client
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$UPSTREAM/releases/latest" --jq '.tag_name')
          published=$(gh api "repos/$UPSTREAM/releases/latest" --jq '.published_at')
          notes_url="https://github.com/$UPSTREAM/releases/tag/$latest"
          # fork 的 package.json 版本就是已经合并过的上游版本；相同则不提醒。
          merged=$(node -p "require('./package.json').version")
          echo "upstream latest: $latest ($published), fork merged: $merged"
          if [ "${latest#v}" = "$merged" ]; then
            echo "fork already on $latest"
            exit 0
          fi
          title="上游发布 $latest：fork 需要合并并重新打包"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "\"$title\" in:title" --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "issue already exists for $latest"
            exit 0
          fi
          body=$(printf '作者仓库发布了新版本 **%s**（%s）。\n\n发布页：%s\n\n本 fork（4K 原生抓帧 / zh_MY 译名 / 出装页 / 赛后海报改造）需要：\n1. `git fetch origin && git merge origin/master`（origin 指向上游）\n2. 解决冲突后 `npm run test:unit && npm run pack`\n3. 重新安装打包出的 exe\n\n客户端里看到的"可更新 %s"提示**不要直接点更新**，那会装回官方版并丢失 fork 的改动。' "$latest" "$published" "$notes_url" "$latest")
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --assignee "${GITHUB_REPOSITORY_OWNER}" --label upstream || \
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --assignee "${GITHUB_REPOSITORY_OWNER}"
